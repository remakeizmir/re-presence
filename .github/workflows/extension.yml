# Packages the editor extension and, when the tokens are there, publishes it to
# both marketplaces: Microsoft's for VS Code, Open VSX for Cursor, Windsurf,
# Antigravity and VSCodium, which cannot use Microsoft's.
#
# The .vsix is attached to the release either way, so there is always a
# download that works without any account at all.
name: extension

on:
  push:
    tags: ["ext-v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: vscode
    # Read once at job level: the secrets context is not available inside a
    # step's `if`, which is what made every run of this die at zero seconds
    # with "workflow file issue" and no log to read.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install
      - run: npm run compile
      - run: npx @vscode/vsce package --no-dependencies --allow-missing-repository -o re-presence.vsix

      # Both registries refuse a version they already hold, which is the right
      # answer to a re-run and the wrong reason for a red pipeline. Anything
      # else still fails.
      - name: VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: |
          cikti=$(npx @vscode/vsce publish --packagePath re-presence.vsix 2>&1) || {
            echo "$cikti"
            echo "$cikti" | grep -qi "already exists" || exit 1
            echo "Bu sürüm Marketplace'te zaten var — atlanıyor."
          }
          echo "$cikti"

      - name: Open VSX
        if: env.OVSX_PAT != ''
        run: |
          cikti=$(npx ovsx publish re-presence.vsix -p "$OVSX_PAT" 2>&1) || {
            echo "$cikti"
            echo "$cikti" | grep -qi "already published" || exit 1
            echo "Bu sürüm Open VSX'te zaten var — atlanıyor."
          }
          echo "$cikti"

      - uses: softprops/action-gh-release@v2
        with:
          files: vscode/re-presence.vsix
