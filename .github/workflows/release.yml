# Builds the agent for the machines people actually have, so the installer can
# download a binary rather than asking anyone to install Go.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Derle
        working-directory: agent
        run: |
          for hedef in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${hedef%/*}"; arch="${hedef#*/}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w" \
              -o "../dist/re-presence-$os-$arch" .
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
